# Build-only workflow for the SparkyFitness backend branch (fork only, not part of the PR).
name: SparkyFitness APK

on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      # Fixed debug key (secret), so every build installs as an update of the previous one.
      # AGP picks up ~/.android/debug.keystore (storepass/keypass android, alias androiddebugkey).
      - name: Install fixed debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$DEBUG_KEYSTORE_B64" || { echo "secret DEBUG_KEYSTORE_B64 missing"; exit 1; }
          mkdir -p ~/.android
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: openScale-sync-debug-apk
          path: src/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: unit-test-results
          path: src/app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 14
